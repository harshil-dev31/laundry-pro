{% extends 'orders/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-gray-800">User Roles & Permissions</h2>
        <a href="{% url 'add_role' %}" class="btn btn-primary shadow-sm">
            <i class="fa-solid fa-plus"></i> Create New Role
        </a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Role Name</th>
                        <th>Permissions Count</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for role in roles %}
                    <tr>
                        <td class="ps-4 fw-bold text-primary">{{ role.name }}</td>
                        <td>
                            <span class="badge bg-secondary">{{ role.permissions.count }} Access Rules</span>
                        </td>
                        <td class="text-end pe-4">
                            <a href="{% url 'edit_role' role.id %}" class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-pen"></i> Edit
                            </a>
                            <a href="{% url 'delete_role' role.id %}" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Are you sure? Users with this role will lose their permissions.');">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-4">No roles defined yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
