{% extends 'orders/base.html' %}

{% block content %}
<div class="container py-5" style="background-color: #f8f9fc; min-height: 100vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h4 class="fw-bold mb-0"><i class="fa-solid fa-shield-halved me-2"></i>Security Settings</h4>
                    <p class="small opacity-75 mb-0">Update your password securely</p>
                </div>

                <div class="card-body p-4">
                    
                    <ul class="nav nav-pills nav-fill mb-4 gap-2" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold border" id="pills-old-tab" data-bs-toggle="pill" data-bs-target="#pills-old" type="button" role="tab">
                                <i class="fa-solid fa-key me-1"></i> Use Old Password
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold border" id="pills-otp-tab" data-bs-toggle="pill" data-bs-target="#pills-otp" type="button" role="tab">
                                <i class="fa-solid fa-envelope me-1"></i> Verify Email
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        
                        <div class="tab-pane fade show active" id="pills-old" role="tabpanel">
                            <form method="post">
                                {% csrf_token %}
                                <input type="hidden" name="auth_method" value="old_pass">
                                
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">CURRENT PASSWORD</label>
                                    <input type="password" name="old_password" class="form-control" required placeholder="Enter current password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">NEW PASSWORD</label>
                                    <input type="password" name="new_password" class="form-control" required placeholder="Enter new password">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold text-muted">CONFIRM NEW PASSWORD</label>
                                    <input type="password" name="confirm_password" class="form-control" required placeholder="Re-enter new password">
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary fw-bold py-2">Update Password</button>
                                </div>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="pills-otp" role="tabpanel">
                            <div class="alert alert-light border border-primary text-primary small mb-3">
                                <i class="fa-solid fa-info-circle me-1"></i> 
                                We will send a code to <strong>{{ request.user.email }}</strong>
                            </div>

                            <div class="d-grid mb-3" id="sendOtpSection">
                                <button type="button" class="btn btn-outline-primary fw-bold" id="sendOtpBtn">
                                    <i class="fa-regular fa-paper-plane me-2"></i> Send Verification Code
                                </button>
                                <div id="otpMessage" class="small text-center mt-2"></div>
                            </div>

                            <form method="post" id="otpResetForm" style="display: none;">
                                {% csrf_token %}
                                <input type="hidden" name="auth_method" value="otp">

                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted text-success">ENTER 6-DIGIT CODE</label>
                                    <input type="text" name="otp_code" class="form-control text-center fw-bold letter-spacing-2 fs-5 border-success" maxlength="6" required placeholder="000000">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">NEW PASSWORD</label>
                                    <input type="password" name="new_password_otp" class="form-control" required placeholder="Enter new password">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold text-muted">CONFIRM NEW PASSWORD</label>
                                    <input type="password" name="confirm_password_otp" class="form-control" required placeholder="Re-enter new password">
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success fw-bold py-2">Verify & Reset Password</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
                
                <div class="card-footer bg-light text-center py-3">
                    <a href="{% url 'customer_dashboard' %}" class="text-decoration-none text-muted small fw-bold">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('sendOtpBtn').addEventListener('click', function() {
        var email = "{{ request.user.email }}";        var btn = this;
        var msgBox = document.getElementById('otpMessage');
        var formSection = document.getElementById('otpResetForm');

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        btn.disabled = true;

        fetch("{% url 'send_otp_email' %}", {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'email=' + encodeURIComponent(email)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                msgBox.innerHTML = '<span class="text-success fw-bold"><i class="fa-solid fa-check"></i> Code sent! Check your inbox.</span>';
                btn.style.display = 'none'; // Hide button
                formSection.style.display = 'block'; // Show inputs
                formSection.classList.add('animate-fade-in'); // Add animation if you have it
            } else {
                msgBox.innerHTML = '<span class="text-danger">' + data.message + '</span>';
                btn.innerHTML = 'Try Again';
                btn.disabled = false;
            }
        })
        .catch(error => {
             console.error('Error:', error);
             msgBox.innerHTML = '<span class="text-danger">Error sending email.</span>';
             btn.disabled = false;
        });
    });
</script>
{% endblock %}
