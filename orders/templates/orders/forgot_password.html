{% extends 'orders/base.html' %} 

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 p-3">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary mb-1">Reset Password</h2>
                        <p class="text-muted small" id="step-description">Enter your username to receive a security code.</p>
                    </div>

                   
                    
                    <form method="POST" action="{% url 'forgot_password' %}">
                        {% csrf_token %}
                        
                        <div id="step1" style="display: {% if show_step3 %}none{% else %}block{% endif %};">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">Username</label>
                                <input type="text" id="username" name="username" class="form-control form-control-lg bg-light border-0 shadow-none" value="{{ username }}" placeholder="Enter your username">
                            </div>
                            <div class="d-grid mb-2">
                                <button type="button" id="sendOtpBtn" onclick="sendResetOTP(event)" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-3">
                                    <i class="fa-solid fa-paper-plane me-2"></i> Send OTP Code
                                </button>
                            </div>
                        </div>

                        <div id="step2" style="display: none;">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">Enter 6-Digit OTP</label>
                                <input type="text" id="otp_code" name="otp_code" class="form-control form-control-lg bg-light border-0 shadow-none text-center fw-bold tracking-widest" style="letter-spacing: 5px;" maxlength="6" value="{{ otp_code }}" placeholder="------">
                            </div>
                            
                            <div class="d-grid gap-2 mb-2">
                                <button type="button" id="verifyOtpBtn" onclick="verifyOTP(event)" class="btn btn-success btn-lg fw-bold shadow-sm rounded-3">
                                    <i class="fa-solid fa-shield-check me-2"></i> Verify Code
                                </button>
                                <button type="button" id="resendOtpBtn" onclick="sendResetOTP(event)" class="btn btn-light text-primary border-0 fw-bold btn-sm mt-1" disabled>
                                    Resend available in 5:00
                                </button>
                            </div>
                        </div>

                        <div id="step3" style="display: {% if show_step3 %}block{% else %}none{% endif %};">
                            <div class="alert alert-success rounded-3 small py-2 mb-4 fw-bold text-center border-0 shadow-sm">
                                <i class="fa-solid fa-circle-check me-1"></i> OTP Verified. Create a new password.
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">New Password</label>
                                <input type="password" name="new_password" class="form-control form-control-lg bg-light border-0 shadow-none" placeholder="Enter new password" {% if show_step3 %}required{% endif %}>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control form-control-lg bg-light border-0 shadow-none" placeholder="Confirm new password" {% if show_step3 %}required{% endif %}>
                            </div>
                            
                            <div class="d-grid mb-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-3">
                                    <i class="fa-solid fa-lock me-2"></i> Save New Password
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-muted small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    let countdownTimer;

    // --- FUNCTION 1: SEND OTP ---
    function sendResetOTP(event) {
        if (event) event.preventDefault(); 
        const username = document.getElementById('username').value.trim();
        if (!username) { alert('Please enter your username first.'); return; }

        const btn = document.getElementById('sendOtpBtn');
        const resendBtn = document.getElementById('resendOtpBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Sending...';
        resendBtn.disabled = true; resendBtn.innerText = "Sending...";

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch("{% url 'send_reset_otp' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrfToken },
            body: new URLSearchParams({ 'username': username })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('step-description').innerText = "We've sent a 6-digit code to your email.";
                
                startCountdown(data.expiry_time); 
            } else {
                alert(data.message);
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Send OTP Code';
                resendBtn.disabled = false; resendBtn.innerText = "Resend OTP";
            }
        })
        .catch(err => alert("Network error."));
    }

    // --- FUNCTION 2: VERIFY OTP ---
    function verifyOTP(event) {
        if (event) event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const otpCode = document.getElementById('otp_code').value.trim();
        if (!otpCode) { alert('Please enter the OTP.'); return; }

        const verifyBtn = document.getElementById('verifyOtpBtn');
        verifyBtn.disabled = true; verifyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Verifying...';

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch("{% url 'verify_reset_otp' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrfToken },
            body: new URLSearchParams({ 'username': username, 'otp_code': otpCode })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
                document.getElementById('step-description').innerText = "Secure your account with a strong password.";
                
                document.querySelector('input[name="new_password"]').required = true;
                document.querySelector('input[name="confirm_password"]').required = true;
            } else {
                alert(data.message); 
                verifyBtn.disabled = false; verifyBtn.innerHTML = '<i class="fa-solid fa-shield-check me-2"></i> Verify Code';
            }
        })
        .catch(err => {
            alert("Network error while verifying.");
            verifyBtn.disabled = false; verifyBtn.innerHTML = '<i class="fa-solid fa-shield-check me-2"></i> Verify Code';
        });
    }

    // --- FUNCTION 3: TIMER ---
    function startCountdown(seconds) {
        const resendBtn = document.getElementById('resendOtpBtn');
        resendBtn.disabled = true;
        clearInterval(countdownTimer);

        countdownTimer = setInterval(() => {
            seconds--;
            let minutes = Math.floor(seconds / 60);
            let remSecs = seconds % 60;
            resendBtn.innerText = `Resend available in ${minutes}:${remSecs < 10 ? '0' : ''}${remSecs}`;

            if (seconds <= 0) {
                clearInterval(countdownTimer);
                resendBtn.disabled = false;
                resendBtn.innerText = "Resend OTP Code";
            }
        }, 1000);
    }
</script>
{% endblock %}
