{% extends 'orders/base.html' %}

{% block content %}
<div class="container mt-5 pt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary mb-1">My Profile</h2>
                <p class="text-muted small">Manage your account settings</p>
            </div>

           

            <div class="card shadow-lg border-0 rounded-4 p-3 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-4"><i class="fa-solid fa-id-badge text-primary me-2"></i> Account Details</h5>
                    
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold small text-muted">Username</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none text-muted" value="{{ request.user.username }}" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold small text-muted">Role</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none text-muted text-capitalize" value="{% if profile %}{{ profile.role }}{% else %}Admin{% endif %}" readonly>
                        </div>
                    </div>
                    
                    {% if profile and profile.business %}
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Assigned Branch</label>
                        <input type="text" class="form-control bg-light border-0 shadow-none text-muted" value="{{ profile.business.name }}" readonly>
                    </div>
                    {% endif %}

                    <div class="mb-2">
                        <label class="form-label fw-bold small text-muted">Current Email</label>
                        <input type="text" class="form-control bg-light border-0 shadow-none" value="{{ request.user.email|default:'No email linked' }}" readonly>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-4 p-3 mb-4 border-top border-4 border-warning">
                <div class="card-body">
                    <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-envelope-circle-check text-warning me-2"></i> Update Email Address</h6>
                    
                    <form method="POST" action="{% url 'staff_profile' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" id="new_email" name="new_email" class="form-control bg-light border-0 shadow-none" placeholder="Enter new email address" required>
                        </div>
                        <!-- #emailMessageArea is used to display success/error messages related to email OTP sending without refreshing the page. You can update its content using JavaScript after the fetch call in sendEmailOTP function. -->
                        <div id="emailMessageArea" class="mb-2"></div>

                        <div class="d-grid mb-3">
                            <button type="button" id="sendEmailOtpBtn" onclick="sendEmailOTP(event)" class="btn btn-warning fw-bold shadow-sm rounded-3">
                                <i class="fa-solid fa-shield-halved me-1"></i> Send OTP to Current Email
                            </button>
                        </div>

                        <div id="otp_section" style="display: none;">
                            <hr>
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Enter 6-Digit OTP</label>
                                <input type="text" name="otp_code" class="form-control form-control-lg bg-light border-0 shadow-none text-center fw-bold tracking-widest" style="letter-spacing: 5px;" maxlength="6" placeholder="------" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm rounded-3">
                                    <i class="fa-solid fa-floppy-disk me-2"></i> Verify & Update Email
                                </button>
                                <button type="button" id="resendOtpBtn" onclick="sendEmailOTP(event)" class="btn btn-light text-primary border-0 fw-bold btn-sm mt-1" disabled>
                                    Calculating time...
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-4 p-3 mb-5 border-top border-4 border-primary">
                <div class="card-body text-center">
                    <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-shield-halved text-primary me-2"></i> Security</h6>
                    <p class="text-muted small mb-3">Update your password using OTP verification.</p>
                    <a href="{% url 'change_password' %}" class="btn btn-outline-primary fw-bold rounded-3 w-100">
                        Change Password
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let countdownTimer; // Define timer variable at the top

    function sendEmailOTP(event) {
        if (event) event.preventDefault();
        
        const newEmail = document.getElementById('new_email').value.trim();
        const msgArea = document.getElementById('emailMessageArea');
        const btn = document.getElementById('sendEmailOtpBtn');
        const resendBtn = document.getElementById('resendOtpBtn'); // Grab resend button

        // Clear any previous messages
        msgArea.innerHTML = '';
        
        if (!newEmail) { 
            msgArea.innerHTML = '<div class="alert alert-danger small py-2 fw-bold text-center border-0 shadow-sm"><i class="fa-solid fa-circle-exclamation me-1"></i> Please enter a new email address first.</div>';
            return; 
        }
        
        btn.disabled = true; 
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Sending OTP...';
        if(resendBtn) resendBtn.disabled = true; // Lock resend button if it exists

        fetch("{% url 'send_email_change_otp' %}", {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: new URLSearchParams({ 'new_email': newEmail })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('otp_section').style.display = 'block';
                btn.innerHTML = '<i class="fa-solid fa-check me-2"></i> OTP Sent!';
                btn.classList.replace('btn-warning', 'btn-success');
                document.getElementById('new_email').readOnly = true; 
                
                // Show Success Message
                msgArea.innerHTML = `<div class="alert alert-success small py-2 fw-bold text-center border-0 shadow-sm"><i class="fa-solid fa-circle-check me-1"></i> ${data.message}</div>`;
                
                // 🔥 ADDED THIS: Start the dynamic countdown timer!
                startCountdown(data.expiry_time || 60); 

            } else {
                // Show Error Message
                msgArea.innerHTML = `<div class="alert alert-danger small py-2 fw-bold text-center border-0 shadow-sm"><i class="fa-solid fa-circle-exclamation me-1"></i> ${data.message}</div>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-shield-halved me-1"></i> Send OTP to Current Email';
            }
        })
        .catch(err => {
            msgArea.innerHTML = '<div class="alert alert-danger small py-2 fw-bold text-center border-0 shadow-sm"><i class="fa-solid fa-triangle-exclamation me-1"></i> Network error. Please try again.</div>';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-shield-halved me-1"></i> Send OTP to Current Email';
        });
    }

    // 🔥 ADDED THIS: The timer function!
    function startCountdown(seconds) {
        const resendBtn = document.getElementById('resendOtpBtn');
        resendBtn.disabled = true;
        clearInterval(countdownTimer);

        let initialMinutes = Math.floor(seconds / 60);
        let initialSecs = seconds % 60;
        resendBtn.innerText = `Resend available in ${initialMinutes}:${initialSecs < 10 ? '0' : ''}${initialSecs}`;

        countdownTimer = setInterval(() => {
            seconds--;
            let minutes = Math.floor(seconds / 60);
            let remSecs = seconds % 60;
            resendBtn.innerText = `Resend available in ${minutes}:${remSecs < 10 ? '0' : ''}${remSecs}`;

            if (seconds <= 0) {
                clearInterval(countdownTimer);
                resendBtn.disabled = false;
                resendBtn.innerText = "Resend OTP Code";
            }
        }, 1000);
    }
</script>
{% endblock %}
