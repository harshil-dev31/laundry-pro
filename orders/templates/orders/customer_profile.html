{% extends 'orders/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="fas fa-user-edit"></i> Edit Profile
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3 text-center mb-4">
                            <span class="badge bg-light text-dark border p-2">
                                Username: <strong>{{ request.user.username }}</strong>
                            </span>
                            <span class="badge bg-light text-dark border p-2 ms-2">
                                Shop: <strong>{{ request.user.customer.business.name }}</strong>
                            </span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            {{ form.name }}
                        </div>
                        <div class="mb-3">
    <label class="form-label fw-bold small text-muted">Email Address</label>
    <input type="email" name="email" class="form-control" 
           value="{{ request.user.email }}" 
           placeholder="Update your email here">
</div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone</label>
                            {{ form.phone }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Address</label>
                            {{ form.address }}
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <a href="{% url 'change_password' %}" class="btn btn-outline-warning mb-2">
                                <i class="fas fa-key"></i> Change Password
                            </a>
                            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                <i class="fas fa-save"></i> Save Changes
                            </button>

                            <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
